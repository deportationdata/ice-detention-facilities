name: "Scrape ICE detention facilities"

on:
  schedule:
    - cron: '0 5 * * *' # every day at 05:00 UTC
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:

  scrape:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted]

    env:
      RENV_PATHS_CACHE: ~/renv-cache
      RENV_CONFIG_PPM_ENABLED: FALSE
      RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/manylinux_2_28/latest

    steps:
      # Mint a DDO_BOT app token first. Using this token for the push and
      # `gh pr create` makes the resulting `pull_request: opened` event
      # trigger downstream workflows (the diff-pr workflow); PRs created with
      # the default GITHUB_TOKEN do not.
      - name: Generate DDO_BOT App token (this repo)
        id: ddo-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DDO_BOT_APP_ID }}
          private-key: ${{ secrets.DDO_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          lfs: true
          clean: true
          # Full history: needed to merge main into an open bot PR's branch.
          fetch-depth: 0
          # Persist the DDO_BOT token in git config so the later `git push`
          # uses it (so push events also fire downstream workflows).
          token: ${{ steps.ddo-token.outputs.token }}

      - name: Ensure clean working tree and snapshot most recent dated file
        id: base
        env:
          GH_TOKEN: ${{ steps.ddo-token.outputs.token }}
        run: |
          git lfs pull
          git checkout -- .

          # Snapshot main's most recent dated file. The PR comment/body reports
          # the cumulative diff against this (everything pending vs main).
          latest_main=$(ls data/facilities-from-ice-website-*.parquet 2>/dev/null | sort | tail -n 1)
          cp "${latest_main:-data/facilities-from-ice-website.parquet}" \
             /tmp/main-facilities-from-ice-website.parquet

          # If a bot PR from an earlier scrape is still open, build on its
          # branch instead of main, so today's scrape is added to that PR.
          # (Previously the run was skipped whenever an open PR touched the
          # same files, so one unmerged PR silently froze all later updates.)
          open_pr=$(gh pr list --state open --limit 200 \
            --json number,headRefName,isCrossRepository \
            --jq '[.[] | select((.headRefName | startswith("facilities-update-")) and (.isCrossRepository | not))]
                  | sort_by(.number) | last // empty | "\(.number) \(.headRefName)"')
          if [ -n "$open_pr" ]; then
            pr_number="${open_pr%% *}"
            pr_branch="${open_pr#* }"
            echo "Open bot PR #$pr_number ($pr_branch) found — building on it."
            git fetch origin "+refs/heads/$pr_branch:refs/remotes/origin/$pr_branch"
            git checkout -B "$pr_branch" "origin/$pr_branch"
            # Bring the PR branch up to date with main so the run uses current
            # code and inputs. If the two conflict a person has to resolve the
            # PR anyway; carry on from the unmerged branch so the scrape is
            # still recorded, and say so on the run page.
            git config --local user.email "ddo-bot@users.noreply.github.com"
            git config --local user.name "DDO Bot"
            if ! git merge --no-edit origin/main; then
              git merge --abort
              msg="PR #$pr_number ($pr_branch) conflicts with main; today's scrape was built on the unmerged PR branch. Resolve or close the PR."
              echo "::warning title=Open facilities PR conflicts with main::$msg"
              echo ":warning: $msg" >> "$GITHUB_STEP_SUMMARY"
            fi
            git lfs pull
            echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
            echo "pr_branch=$pr_branch" >> "$GITHUB_OUTPUT"
          fi

          # Snapshot the most recent dated file on the branch we're building
          # on (main, or the open PR's branch). The matcher and the
          # "anything new today?" check diff today's scrape against this.
          latest=$(ls data/facilities-from-ice-website-*.parquet 2>/dev/null | sort | tail -n 1)
          if [ -n "$latest" ]; then
            cp "$latest" /tmp/old-facilities-from-ice-website.parquet
          else
            # no prior dated file — use empty placeholder so diff treats everything as new
            cp data/facilities-from-ice-website.parquet /tmp/old-facilities-from-ice-website.parquet
          fi

      - name: Restore renv library
        run: |
          Rscript -e "
            renv::hydrate(sources = '~/R/aarch64-unknown-linux-gnu-library/4.5')
          "

      - name: Run scraper
        run: Rscript code/0-ice-website-scraper.R

      - name: Run process script (refresh stable file)
        run: Rscript code/1-process-ice-website.R

      - name: Stage today's dated file for diff
        run: |
          today_file="data/facilities-from-ice-website-$(date -u +%Y-%m-%d).parquet"
          cp "$today_file" /tmp/new-facilities-from-ice-website.parquet

      - name: Match new website facilities to existing codes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            msg="OPENAI_API_KEY secret is missing or empty: new website facilities are not fuzzy-matched to existing codes and get synthetic XX placeholders instead."
            echo "::warning title=Website matcher has no OpenAI key::$msg"
            echo ":warning: $msg" >> "$GITHUB_STEP_SUMMARY"
          fi
          Rscript code/0-match-website-new-facilities.R

      - name: Check for changes
        id: check_changes
        env:
          PR_NUMBER: ${{ steps.base.outputs.pr_number }}
          PR_BRANCH: ${{ steps.base.outputs.pr_branch }}
        run: |
          today_file="data/facilities-from-ice-website-$(date -u +%Y-%m-%d).parquet"
          today_branch="facilities-update-$(date -u +%Y-%m-%d)"
          scrape_files=("$today_file" data/facilities-from-ice-website.parquet
                        data/facilities-website-matches.parquet)

          # Record why nothing was proposed, visibly on the run page, so a
          # skipped run can't be mistaken for a run that had nothing to do.
          skip() {
            echo "$1"
            echo "::notice title=No facilities update proposed::$1"
            echo "**No facilities update proposed:** $1" >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # Put the scrape outputs back to the committed state.
          discard() {
            git reset -q HEAD -- "${scrape_files[@]}"
            git checkout -- data/facilities-from-ice-website.parquet \
                            data/facilities-website-matches.parquet
            if git ls-files --error-unmatch "$today_file" >/dev/null 2>&1; then
              git checkout -- "$today_file"
            else
              rm -f "$today_file"
            fi
          }

          if [ -z "$PR_BRANCH" ]; then
            # No open bot PR: start today's branch from main. Skip if it already
            # exists on the remote (e.g. from an earlier run today whose PR was
            # merged or closed). Re-pushing would either be rejected as
            # non-fast-forward or open a duplicate PR.
            if git ls-remote --exit-code --heads origin "$today_branch" >/dev/null 2>&1; then
              skip "Remote branch '$today_branch' already exists and has no open PR."
            fi
            git checkout -B "$today_branch"
          fi

          git add "${scrape_files[@]}"
          if git diff --cached --quiet; then
            skip "Scrape matches what is already on ${PR_BRANCH:-main}."
          fi

          # Change summary: today's scrape vs the previous dated file on the
          # branch we're building on.
          Rscript code/0-ice-website-diff.R

          # If binary files differ but data content is identical, discard and skip
          if grep -qF 'NO_REAL_CHANGES' /tmp/facilities-changes.txt; then
            discard
            skip "Binary files differ but data content is identical to ${PR_BRANCH:-main}."
          fi

          # Cumulative summary: today's scrape vs main's latest dated file, i.e.
          # everything the PR proposes once today's scrape is added to it.
          # (The diff script reads and writes fixed /tmp paths, so swap its
          # "old" input and move its output aside.)
          cp /tmp/facilities-changes.txt /tmp/facilities-changes-today.txt
          cp /tmp/old-facilities-from-ice-website.parquet /tmp/prev-facilities-from-ice-website.parquet
          cp /tmp/main-facilities-from-ice-website.parquet /tmp/old-facilities-from-ice-website.parquet
          Rscript code/0-ice-website-diff.R
          mv /tmp/facilities-changes.txt /tmp/facilities-changes-vs-main.txt
          mv /tmp/facilities-changes-today.txt /tmp/facilities-changes.txt
          mv /tmp/prev-facilities-from-ice-website.parquet /tmp/old-facilities-from-ice-website.parquet

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Run CI-friendly data pipeline
        if: steps.check_changes.outputs.changed == 'true'
        env:
          GOOGLEGEOCODE_API_KEY: ${{ secrets.GOOGLEGEOCODE_API_KEY }}
        run: |
          # CI subset of run_all.sh — skips the 1-process-* scripts that read
          # from local Box folders or sibling repos. Their outputs are already
          # committed parquets that the rest of the pipeline picks up. Local
          # users should still run `bash code/run_all.sh` to refresh those
          # upstream inputs.
          bash code/run_ci.sh
          git add data/

      - name: Commit and push
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "ddo-bot@users.noreply.github.com"
          git config --local user.name "DDO Bot"
          git commit -m "Update ICE website facilities data [skip ci]"
          # checkout's `token:` configured the DDO_BOT token in git's
          # extraheader, so this push uses it. When building on an open PR's
          # branch this is a fast-forward of that branch.
          git push --set-upstream origin HEAD

      - name: Create or update pull request
        if: steps.check_changes.outputs.changed == 'true'
        id: create_pr
        env:
          GH_TOKEN: ${{ steps.ddo-token.outputs.token }}
          PR_NUMBER: ${{ steps.base.outputs.pr_number }}
        run: |
          today="$(date -u +%Y-%m-%d)"
          if [ -n "$PR_NUMBER" ]; then
            # An earlier bot PR is still open: today's scrape was pushed to its
            # branch. Leave its description alone and add a comment with what
            # is new today plus the running total against main.
            {
              echo "Refreshed with the $today scrape of the ICE detention facilities page."
              echo ""
              echo "### New since the previous scrape on this PR"
              echo ""
              cat /tmp/facilities-changes.txt
              if [ -s /tmp/website-match-summary.md ]; then
                echo ""
                cat /tmp/website-match-summary.md
              fi
              echo ""
              echo "### All website changes in this PR vs main"
              echo ""
              if grep -qF 'NO_REAL_CHANGES' /tmp/facilities-changes-vs-main.txt; then
                echo "None — the website listing is back to what is on main."
              else
                cat /tmp/facilities-changes-vs-main.txt
              fi
            } > /tmp/pr-body.txt
            pr_url=$(gh pr comment "$PR_NUMBER" --body-file /tmp/pr-body.txt)
            pr_num="$PR_NUMBER"
            echo "Added the $today scrape to open PR #$pr_num." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "Automated update: changes detected in ICE detention facilities data."
              echo ""
              cat /tmp/facilities-changes.txt
              if [ -s /tmp/website-match-summary.md ]; then
                echo ""
                cat /tmp/website-match-summary.md
              fi
            } > /tmp/pr-body.txt

            pr_url=$(gh pr create \
              --title "Facilities update $today" \
              --body-file /tmp/pr-body.txt \
              --reviewer graemeblair \
              --base main)
            pr_num="${pr_url##*/}"
            echo "Opened PR #$pr_num for the $today scrape." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "pr_url=${pr_url}"     >> "$GITHUB_OUTPUT"
          echo "pr_number=${pr_num}"  >> "$GITHUB_OUTPUT"

      - name: Trigger diff workflow
        # repository_dispatch always fires, even from GITHUB_TOKEN — so the
        # diff workflow runs reliably without depending on the DDO_BOT app
        # having Actions: write permission.
        if: steps.create_pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/dispatches" \
            -f event_type=diff-pr \
            -F "client_payload[pr_number]=${{ steps.create_pr.outputs.pr_number }}"

  notify-ddo:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'facilities-update-')
    runs-on: ubuntu-latest
    steps:
      - name: Generate DDO_BOT App token for deportationdata.org
        id: ddo-app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DDO_BOT_APP_ID }}
          private-key: ${{ secrets.DDO_BOT_PRIVATE_KEY }}
          owner: deportationdata
          repositories: deportationdata.org

      - name: Trigger deportationdata.org rebuild
        env:
          GH_TOKEN: ${{ steps.ddo-app-token.outputs.token }}
        run: |
          gh api repos/deportationdata/deportationdata.org/dispatches \
            -f event_type=facilities-updated
